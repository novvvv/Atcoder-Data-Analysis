<div class="part">
<section>
<h3>問題文</h3><p>長さ <var>3</var> の数列 <var>A=(A_1,A_2,A_3)</var> が与えられます。</p>
<p><var>A</var> を適切に並び替えて等差数列にすることはできますか？</p>
<p>即ち、<var>A_3-A_2=A_2-A_1</var> を満たすように <var>A</var> を並び替えることはできますか？</p>
</section>
</div>

<div class="part">
<section>
<h3>制約</h3><ul>
<li><var>1 \leq A_i \leq 100</var></li>
<li>入力は全て整数</li>
</ul>
</section>
</div>

<hr />
<div class="io-style">
<div class="part">
<section>
<h3>入力</h3><p>入力は以下の形式で標準入力から与えられる。</p>
<pre><var>A_1</var> <var>A_2</var> <var>A_3</var>
</pre>
</section>
</div>

<div class="part">
<section>
<h3>出力</h3><p><var>A</var> を並び替えて等差数列にできるなら <code>Yes</code>、できないなら <code>No</code> と出力せよ。</p>
</section>
