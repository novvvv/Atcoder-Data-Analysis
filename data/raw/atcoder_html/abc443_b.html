<h3>問題文</h3><p>年に <var>1</var> 度の節分には年齢と同じ数の豆を食べます。高橋君はそれ以外に豆を食べることはありません。<br />
高橋君は、今年 ( <var>0</var> 年後 ) の節分の時点で <var>N</var> 歳です。</p>
<p>高橋君が今年以降 (今年を含む) で累計 <var>K</var> 個以上の豆を食べたことになるのは、最短で何年後の節分ですか？<br />
なお、高橋君は不死身なので、高橋君が今年以降で累計 <var>K</var> 個以上の豆を食べたという状況は必ず訪れます。</p>
