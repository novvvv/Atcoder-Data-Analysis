<h3>問題文</h3><p><var>N</var> 個の整数からなる配列 <var>A=(A_1,A_2,...,A_N)</var> が与えられるので、次の条件を全て満たす整数組 <var>(i,j)</var> の数を求めてください。</p>

<li><var>A_i \neq A_j</var></li>
</ul>

</ul>
</section>
