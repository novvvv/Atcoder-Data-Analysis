<h3>問題文</h3><p><code>A</code>, <code>B</code>, <code>C</code> からなる文字列 <var>S</var> が与えられます。<var>S</var> は <code>A</code>, <code>B</code>, <code>C</code> を全て含むことが保証されます。</p>
