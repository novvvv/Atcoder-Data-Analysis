<p>配点 : <var>100</var> 点</p>

<div class="part">
<section>
<h3>問題文</h3><p>英小文字からなる長さ <var>N</var> の文字列 <var>S</var> が与えられます。<br />
<var>S</var> の中で <code>a</code> と <code>b</code> が隣接する箇所があれば <code>Yes</code> を、なければ <code>No</code> を出力してください。(<code>a</code> と <code>b</code> の順序は問いません。)</p>
</section>
</div>

<div class="part">
<section>
<h3>制約</h3><ul>
<li><var>2 \leq N \leq 100</var></li>
<li><var>S</var> は英小文字からなる長さ <var>N</var> の文字列</li>
</ul>
</section>
</div>

<hr />
<div class="io-style">
<div class="part">
<section>
<h3>入力</h3><p>入力は以下の形式で標準入力から与えられる。</p>
<pre><var>N</var>
<var>S</var>
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力</h3><p><var>S</var> の中で <code>a</code> と <code>b</code> が隣接する箇所があれば <code>Yes</code> を、なければ <code>No</code> を出力せよ。</p>
</section>
