<h3>問題文</h3><p>正整数 <var>N</var> が与えられます。</p>
<p><var>i=1,2,\ldots,N</var> について <var>(-1)^i \times i^3</var> を計算したときの、それら <var>N</var> 個の値の総和を求めてください。</p>
<p>すなわち、 <var>\displaystyle \sum_{i=1}^N (-1)^i \times i^3</var> を求めてください。</p>
</section>

<section>

<li><var>N</var> は <var>1</var> 以上 <var>10</var> 以下の整数</li>
</ul>
</section>

<div class="io-style">
<div class="part">

<pre><var>N</var>
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力</h3><p><var>\displaystyle \sum_{i=1}^N (-1)^i \times i^3</var> の値を出力せよ。</p>
