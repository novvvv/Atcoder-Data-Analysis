<div class="part">
<section>
<h3>問題文</h3><p>正整数 <var>A,B</var> が与えられます。<br />
<var>A^B+B^A</var> の値を出力してください。</p>
</section>
</div>

<div class="part">
<section>
<h3>制約</h3><ul>
<li><var>2 \leq A \leq B \leq 9</var></li>
<li>入力される数値はすべて整数</li>
</ul>
</section>
</div>

<hr />
<div class="io-style">
<div class="part">
<section>
<h3>入力</h3><p>入力は以下の形式で標準入力から与えられる。</p>
<pre><var>A</var> <var>B</var>
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力</h3><p>答えを整数として出力せよ。</p>
</section>
</div>
</div>

<hr />
<div class="part">
<section>
<h3>入力例 1</h3><pre>2 8
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力例 1</h3><pre>320
</pre>

<p><var>A = 2, B = 8</var> のとき、<var>A^B = 256, B^A = 64</var> なので <var>A^B + B^A = 320</var> です。</p>
</section>
</div>

<hr />
<div class="part">
<section>
<h3>入力例 2</h3><pre>9 9
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力例 2</h3><pre>774840978
</pre>

</section>
</div>

<hr />
<div class="part">
<section>
<h3>入力例 3</h3><pre>5 6
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力例 3</h3><pre>23401
</pre></section>
</div>
