
<p>配点 : <var>100</var> 点</p>

<div class="part">
<section>
<h3>問題文</h3><p>以下の条件を全て満たす長さ <var>N</var> の文字列を求めてください。</p>
<ul>
<li>各文字は <code>-</code> または <code>=</code> である</li>
<li>回文である</li>
<li>文字列中に <code>=</code> は <var>1</var> 個または <var>2</var> 個含まれる。 <var>2</var> 個含まれる場合、それらの <code>=</code> は隣接している</li>
</ul>
<p>なお、そのような文字列はちょうど <var>1</var> つ存在します。</p>
</section>
</div>

<div class="part">
<section>
<h3>制約</h3><ul>
<li><var>1 \leq N \leq 100</var></li>
<li><var>N</var> は整数である</li>
</ul>
</section>
</div>

<hr />
<div class="io-style">
<div class="part">
<section>
<h3>入力</h3><p>入力は以下の形式で標準入力から与えられる。</p>
<pre><var>N</var>
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力</h3><p>答えを出力せよ。  </p>
</section>
</div>
</div>

<hr />
<div class="part">
<section>
<h3>入力例 1</h3><pre>4
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力例 1</h3><pre>-==-
</pre>

</section>
</div>

<hr />
<div class="part">
<section>
<h3>入力例 2</h3><pre>7
</pre>

</section>
</div>

<div class="part">
<section>
<h3>出力例 2</h3><pre>---=---
</pre></section>
</div>
